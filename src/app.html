// Server-injected base web app URL (populated on window by includeApp)
if (typeof window.SERVER_WEB_APP_URL === 'undefined') {
  window.SERVER_WEB_APP_URL = '';
}

/**
 * Safe navigation helper to prevent top-level navigation to googleusercontent.com sandbox.
 * Resolves base script.google.com URL from server variable, document.referrer, anchor href, or current URL.
 * Falls back to the calling anchor element's own href if all other sources fail.
 * @param {string} pageName - Target page name (e.g. 'admin', 'dashboard', 'index', 'general')
 * @param {HTMLAnchorElement|null} [anchorEl=null] - The anchor element that triggered navigation (optional fallback)
 */
function navigateToPage(pageName, anchorEl) {
  let baseUrl = (window.SERVER_WEB_APP_URL || '').trim();

  // Recovery 1: try document.referrer (only valid in Apps Script iframe context)
  if (!baseUrl || !baseUrl.includes('script.google.com')) {
    if (typeof document !== 'undefined' && document.referrer && document.referrer.includes('script.google.com')) {
      baseUrl = document.referrer.split('?')[0];
    }
  }

  // Recovery 2: try to derive base from the anchor element's href attribute
  if ((!baseUrl || !baseUrl.includes('script.google.com')) && anchorEl && anchorEl.href) {
    const anchorHref = anchorEl.href;
    if (anchorHref.includes('script.google.com')) {
      baseUrl = anchorHref.split('?')[0];
    }
  }

  // Recovery 3: try current window location (works if top-level, not in sandbox)
  if (!baseUrl || !baseUrl.includes('script.google.com')) {
    try {
      const loc = (window.top || window).location.href;
      if (loc && loc.includes('script.google.com')) {
        baseUrl = loc.split('?')[0];
      }
    } catch (e) {
      console.warn('Unable to read top-level URL for navigation fallback:', e);
    }
  }

  if (baseUrl && baseUrl.includes('script.google.com')) {
    const cleanUrl = baseUrl.split('?')[0];
    const targetUrl = `${cleanUrl}?page=${pageName}`;
    try {
      if (window.top && window.top.location) {
        window.top.location.href = targetUrl;
      } else {
        window.location.href = targetUrl;
      }
    } catch (e) {
      // Cross-origin restriction — navigate the inner frame directly
      window.location.href = targetUrl;
    }
  } else {
    // Local preview fallback: update ?page= query param in current URL
    const urlParams = new URLSearchParams(window.location.search);
    urlParams.set('page', pageName);
    window.location.search = urlParams.toString();
  }
}

/**
 * Evaluates client-side triage flag solely based on Kendala text content.
 * @param {string} kendalaText 
 * @returns {{ severity: string, rank: number }}
 */
function evaluateFlags(kendalaText) {
  const hasKendala = !!(kendalaText && String(kendalaText).trim().length > 0 && String(kendalaText).trim() !== '-');
  return hasKendala
    ? { severity: 'urgent', rank: 1 }
    : { severity: 'normal', rank: 2 };
}

/**
 * Promise wrapper for google.script.run
 */
function runServer(fnName, ...args) {
  return new Promise((resolve, reject) => {
    if (typeof google !== 'undefined' && google && google.script && google.script.run) {
      let isSettled = false;
      const timeoutTimer = setTimeout(() => {
        if (!isSettled) {
          isSettled = true;
          reject(new Error(`Server RPC '${fnName}' timed out after 25s`));
        }
      }, 25000);

      google.script.run
        .withSuccessHandler((res) => {
          if (!isSettled) {
            isSettled = true;
            clearTimeout(timeoutTimer);
            resolve(res);
          }
        })
        .withFailureHandler((err) => {
          if (!isSettled) {
            isSettled = true;
            clearTimeout(timeoutTimer);
            reject(err);
          }
        })
        [fnName](...args);
    } else {
      reject(new Error('google.script.run unavailable (local mode)'));
    }
  });
}

/**
 * Checks if the current page is running inside Apps Script HtmlService environment.
 */
function isLiveServer() {
  return typeof google !== 'undefined' && google && google.script && google.script.run;
}

/**
 * Toast / Snackbar Notification Engine
 */
function showToast(message, type = 'info', duration = 3500) {
  let container = document.getElementById('toastContainer');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toastContainer';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  
  let iconHtml = '';
  if (type === 'success') {
    iconHtml = '<svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>';
  } else if (type === 'error') {
    iconHtml = '<svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>';
  } else if (type === 'warning') {
    iconHtml = '<svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.29 3.86l-8.18 14A2 2 0 0 0 3.82 21h16.36a2 2 0 0 0 1.71-3.14l-8.18-14a2 2 0 0 0-3.42 0z"/></svg>';
  } else {
    iconHtml = '<svg class="svg-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';
  }

  toast.innerHTML = `
    <div class="toast-content">
      ${iconHtml}
      <span>${message}</span>
    </div>
    <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
  `;

  container.appendChild(toast);

  setTimeout(() => {
    toast.classList.add('toast-fade-out');
    setTimeout(() => {
      if (toast.parentElement) toast.remove();
    }, 300);
  }, duration);
}

/**
 * CSV Exporter Helper
 */
function downloadCSV(filename, headers, rows) {
  const escapeCell = (val) => {
    if (val === null || val === undefined) return '""';
    const str = String(val).replace(/"/g, '""');
    return `"${str}"`;
  };

  const csvContent = [
    headers.map(escapeCell).join(','),
    ...rows.map(row => row.map(escapeCell).join(','))
  ].join('\r\n');

  const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.setAttribute('href', url);
  link.setAttribute('download', filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/**
 * Renders user identity strip in Internal Console header
 */
async function renderIdentityStrip() {
  const stripEl = document.getElementById('userIdentityStrip');
  if (!stripEl) return;

  // Skip client-side re-render if identity strip is already populated server-side
  if (stripEl.children.length > 0 && stripEl.querySelector('.user-email')) {
    return;
  }

  if (isLiveServer()) {
    try {
      const info = await runServer('getUserIdentityInfo');
      if (info && info.email) {
        let roleBadge = '';
        if (info.role === 'both') {
          roleBadge = '<span class="badge badge-primary">Admin &amp; Manager</span>';
        } else if (info.role === 'admin') {
          roleBadge = '<span class="badge badge-primary">Admin Operasional</span>';
        } else if (info.role === 'manager') {
          roleBadge = '<span class="badge badge-normal">Executive Manager</span>';
        } else {
          roleBadge = '<span class="badge badge-neutral">Tamu</span>';
        }

        const avatarInitial = info.email ? info.email.charAt(0).toUpperCase() : 'S';

        stripEl.innerHTML = `
          <div class="user-identity-menu">
            <div class="user-avatar">${avatarInitial}</div>
            <div class="user-info">
              <span class="user-email">${info.email}</span>
              ${roleBadge}
            </div>
            <svg class="svg-icon user-dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        `;
        
        _showInternalNavLinks(info.role);
        return;
      }
    } catch (err) {
      console.error('Failed to get user identity:', err);
    }
  }

  // Fallback for local preview mode
  stripEl.innerHTML = `
    <div class="user-identity-menu">
      <div class="user-avatar">L</div>
      <div class="user-info">
        <span class="user-email">local.dev@agri.co.id</span>
        <span class="badge badge-neutral">Local Preview</span>
      </div>
      <svg class="svg-icon user-dropdown-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  `;
  _showInternalNavLinks('both');
}

// Local Database Fallback Initialization
function getDB() {
  let db = localStorage.getItem('MPL_REPORTING_DB');
  if (!db) {
    const defaultData = {
      dailyReports: [],
      generalReports: [],
      operationalReports: []
    };
    localStorage.setItem('MPL_REPORTING_DB', JSON.stringify(defaultData));
    return defaultData;
  }
  const parsed = JSON.parse(db);
  // Purge old prototype mockup reports if present in local storage
  if (parsed.dailyReports && parsed.dailyReports.some(r => r.id === 'REC-001' || r.yield === 1450)) {
    parsed.dailyReports = [];
    parsed.generalReports = [];
    parsed.operationalReports = [];
    localStorage.setItem('MPL_REPORTING_DB', JSON.stringify(parsed));
  }
  return parsed;
}

function saveDB(db) {
  localStorage.setItem('MPL_REPORTING_DB', JSON.stringify(db));
}

/**
 * Shared Period Summary & Date Range Helpers (Guards against numeric drift)
 */
function formatDateISO(d) {
  if (!d || isNaN(d.getTime())) return '';
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function getPeriodDateRanges(periodKey, customStart = '', customEnd = '') {
  const now = new Date();
  
  if (periodKey === 'last_week') {
    const dayOfWeek = now.getDay();
    const distToMon = (dayOfWeek === 0 ? 6 : dayOfWeek - 1);
    const thisMon = new Date(now);
    thisMon.setDate(now.getDate() - distToMon);
    
    const lastMon = new Date(thisMon);
    lastMon.setDate(thisMon.getDate() - 7);
    const lastSun = new Date(thisMon);
    lastSun.setDate(thisMon.getDate() - 1);
    
    const priorMon = new Date(lastMon);
    priorMon.setDate(lastMon.getDate() - 7);
    const priorSun = new Date(lastMon);
    priorSun.setDate(lastMon.getDate() - 1);

    return {
      startDate: formatDateISO(lastMon),
      endDate: formatDateISO(lastSun),
      prevStartDate: formatDateISO(priorMon),
      prevEndDate: formatDateISO(priorSun),
      label: 'Minggu Lalu'
    };
  } else if (periodKey === 'this_month') {
    const curYear = now.getFullYear();
    const curMonth = now.getMonth();
    
    const start = new Date(curYear, curMonth, 1);
    const end = new Date(curYear, curMonth + 1, 0);
    
    const prevStart = new Date(curYear, curMonth - 1, 1);
    const prevEnd = new Date(curYear, curMonth, 0);
    
    return {
      startDate: formatDateISO(start),
      endDate: formatDateISO(end),
      prevStartDate: formatDateISO(prevStart),
      prevEndDate: formatDateISO(prevEnd),
      label: 'Bulan Ini'
    };
  } else if (periodKey === 'custom') {
    let startD = customStart ? new Date(customStart) : new Date(now.getFullYear(), now.getMonth(), 1);
    let endD = customEnd ? new Date(customEnd) : new Date();
    if (isNaN(startD.getTime())) startD = new Date();
    if (isNaN(endD.getTime())) endD = new Date();
    if (startD > endD) { const tmp = startD; startD = endD; endD = tmp; }
    
    const diffTime = Math.abs(endD - startD);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
    
    const prevEndD = new Date(startD);
    prevEndD.setDate(startD.getDate() - 1);
    
    const prevStartD = new Date(prevEndD);
    prevStartD.setDate(prevEndD.getDate() - diffDays + 1);
    
    return {
      startDate: formatDateISO(startD),
      endDate: formatDateISO(endD),
      prevStartDate: formatDateISO(prevStartD),
      prevEndDate: formatDateISO(prevEndD),
      label: 'Kustom'
    };
  } else {
    // Default: 'this_week'
    const dayOfWeek = now.getDay();
    const distToMon = (dayOfWeek === 0 ? 6 : dayOfWeek - 1);
    const thisMon = new Date(now);
    thisMon.setDate(now.getDate() - distToMon);
    const thisSun = new Date(thisMon);
    thisSun.setDate(thisMon.getDate() + 6);
    
    const lastMon = new Date(thisMon);
    lastMon.setDate(thisMon.getDate() - 7);
    const lastSun = new Date(thisMon);
    lastSun.setDate(thisMon.getDate() - 1);
    
    return {
      startDate: formatDateISO(thisMon),
      endDate: formatDateISO(thisSun),
      prevStartDate: formatDateISO(lastMon),
      prevEndDate: formatDateISO(lastSun),
      label: 'Minggu Ini'
    };
  }
}

function computePeriodSummary(rows, startDateStr, endDateStr) {
  const filtered = [];
  const unresolvedKendalaRows = [];
  
  let totalPanen = 0;
  let totalNilaiPenjualan = 0;
  
  const locationsMap = {};
  
  const divisionStats = {
    Agro: { name: 'Agro (Pertanian/Perkebunan)', count: 0, panen: 0, sales: 0 },
    Ternak: { name: 'Ternak (Peternakan)', count: 0, panen: 0, sales: 0 },
    Ikan: { name: 'Ikan (Perikanan)', count: 0, panen: 0, sales: 0 }
  };

  function normalizeDivKey(divStr) {
    const s = String(divStr || '').toLowerCase();
    if (s.includes('agro') || s.includes('tani') || s.includes('kebun') || s.includes('pertanian') || s.includes('perkebunan')) return 'Agro';
    if (s.includes('ternak') || s.includes('kandang') || s.includes('peternakan')) return 'Ternak';
    if (s.includes('ikan') || s.includes('kolam') || s.includes('tambak') || s.includes('perikanan')) return 'Ikan';
    return 'Agro';
  }

  (rows || []).forEach(item => {
    let itemDate = '';
    if (item.timestamp) {
      itemDate = String(item.timestamp).split(' ')[0];
    }
    
    if (startDateStr && itemDate < startDateStr) return;
    if (endDateStr && itemDate > endDateStr) return;
    
    filtered.push(item);
    
    const panenVal = parseFloat(item.jumlahPanen || (item.raw ? item.raw[15] : 0)) || 0;
    const salesVal = parseFloat(item.nilaiPenjualanRp || (item.raw ? item.raw[19] : 0)) || 0;
    
    totalPanen += panenVal;
    totalNilaiPenjualan += salesVal;
    
    const divKey = normalizeDivKey(item.divisi);
    if (divisionStats[divKey]) {
      divisionStats[divKey].count++;
      divisionStats[divKey].panen += panenVal;
      divisionStats[divKey].sales += salesVal;
    }
    
    const loc = String(item.lokasi || item.site || '').trim();
    if (loc && loc !== '-') {
      const locKey = loc.toLowerCase();
      if (!locationsMap[locKey]) {
        locationsMap[locKey] = loc;
      }
    }
    
    const reviewStatus = String(item.reviewStatus || 'Unreviewed');
    const kendalaText = String(item.kendala || (item.raw ? item.raw[20] : '') || '').trim();
    const upayaText = String(item.upaya || (item.raw ? item.raw[21] : '') || '').trim();
    
    const isUnresolved = (reviewStatus !== 'Closed') || (kendalaText !== '' && upayaText === '');
    if (isUnresolved) {
      unresolvedKendalaRows.push(item);
    }
  });

  return {
    totalLaporan: filtered.length,
    totalPanen: totalPanen,
    totalNilaiPenjualan: totalNilaiPenjualan,
    unresolvedCount: unresolvedKendalaRows.length,
    unresolvedRows: unresolvedKendalaRows,
    locationsMap: locationsMap,
    divisionStats: divisionStats,
    rows: filtered
  };
}
</script>
