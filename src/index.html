<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Operasional Harian — Sistem Pelaporan Digital</title>
  <?!= include('style'); ?>
</head>
<body>

  <header class="<?= userRole ? 'header-internal' : '' ?>">
    <div class="nav-container">
      <a href="<?= webAppUrl ?>?page=<?= userRole ? 'admin' : 'index' ?>" target="_top" class="logo">
        <span class="logo-badge <?= userRole ? 'logo-badge-internal' : '' ?>"><?= userRole ? 'INTERNAL CONSOLE' : 'AGRI-DIGITAL' ?></span>
        <span><?= userRole ? 'Portal Operasional' : 'Portal Pelaporan' ?></span>
      </a>
      <? if (userRole) { ?>
        <div id="userIdentityStrip"></div>
      <? } ?>
      <nav>
        <a href="<?= webAppUrl ?>?page=index" target="_top" class="nav-link <?= currentPage === 'index' ? 'active' : '' ?>">Daily Form</a>
        <a href="<?= webAppUrl ?>?page=general" target="_top" class="nav-link <?= currentPage === 'general' ? 'active' : '' ?>">General Form</a>
        <? if (userRole) { ?>
          <span style="opacity: 0.35; margin: 0 0.35rem; color: var(--color-gray-400);">|</span>
          <a href="<?= webAppUrl ?>?page=admin" target="_top" id="navLinkAdmin" class="nav-link <?= currentPage === 'admin' ? 'active' : '' ?>">Admin Queue</a>
          <a href="<?= webAppUrl ?>?page=dashboard" target="_top" id="navLinkDashboard" class="nav-link <?= currentPage === 'dashboard' ? 'active' : '' ?>">Manager Dashboard</a>
        <? } ?>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h1 class="card-title">Laporan Operasional Harian</h1>
      <p class="card-subtitle">Silakan isi laporan aktivitas harian Anda. Pengisian memerlukan waktu &lt; 2 menit.</p>

      <form id="dailyForm">
        <div class="form-group">
          <label for="empId">Kode Karyawan / Employee ID <span class="required">*</span></label>
          <div class="help-text">Masukkan kode resmi karyawan Anda (contoh: EMP-101)</div>
          <input type="text" id="empId" placeholder="EMP-101" required>
        </div>

        <div class="form-group">
          <label for="site">Lokasi / Site <span class="required">*</span></label>
          <select id="site" required>
            <option value="">-- Pilih Lokasi Kerja --</option>
            <option value="Site A — Kebun &amp; Lahan Pertanian">Site A — Kebun &amp; Lahan Pertanian</option>
            <option value="Site B — Peternakan &amp; Kandang">Site B — Peternakan &amp; Kandang</option>
            <option value="Site C — Pabrik Pengolahan &amp; Pakan">Site C — Pabrik Pengolahan &amp; Pakan</option>
            <option value="Site D — Logistik &amp; Gudang">Site D — Logistik &amp; Gudang</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reportDate">Tanggal Laporan <span class="required">*</span></label>
          <input type="date" id="reportDate" required>
        </div>

        <div class="form-group">
          <label for="taskStatus">Status Tugas / Target <span class="required">*</span></label>
          <select id="taskStatus" required>
            <option value="Completed">Completed (Selesai Sesuai Target)</option>
            <option value="In Progress">In Progress (Sedang Berjalan)</option>
            <option value="Delayed">Delayed (Tertunda / Ada Hambatan)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="yieldKg">Hasil Panen / Produksi (Kg)</label>
          <div class="help-text">Isi total kilogram hasil panen hari ini (opsional)</div>
          <input type="number" id="yieldKg" placeholder="0" min="0">
        </div>

        <div class="form-group">
          <label>Ada Masalah Hari Ini? (Issues)</label>
          <div class="checkbox-group">
            <label class="checkbox-card">
              <input type="checkbox" name="issues" value="Equipment"> Equipment (Alat)
            </label>
            <label class="checkbox-card">
              <input type="checkbox" name="issues" value="Weather"> Weather (Cuaca)
            </label>
            <label class="checkbox-card">
              <input type="checkbox" name="issues" value="Shortage"> Shortage (Stok)
            </label>
            <label class="checkbox-card">
              <input type="checkbox" name="issues" value="None" checked> None (Lancar)
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Kirim Laporan Harian</button>
      </form>
    </div>
  </div>

  <?!= include('app'); ?>
  <script>
    document.getElementById('reportDate').valueAsDate = new Date();

    document.getElementById('dailyForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = this.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Mengirim...';

      const empId = document.getElementById('empId').value;
      const site = document.getElementById('site').value;
      const date = document.getElementById('reportDate').value;
      const status = document.getElementById('taskStatus').value;
      const yieldKg = parseFloat(document.getElementById('yieldKg').value) || 0;
      
      const issueNodes = document.querySelectorAll('input[name="issues"]:checked');
      const issues = Array.from(issueNodes).map(n => n.value);

      const payload = { empId, site, date, taskStatus: status, yieldKg, issues };

      try {
        if (isLiveServer()) {
          await runServer('submitDailyReport', payload);
        } else {
          const flag = evaluateFlags(status + ' ' + issues.join(' '));
          const db = getDB();
          db.dailyReports.unshift({
            id: 'REC-' + Date.now(),
            timestamp: formatDateNow(),
            empId: empId,
            site: site,
            date: date,
            status: status,
            yield: yieldKg,
            issues: issues,
            severity: flag.severity,
            rank: flag.rank,
            category: flag.category,
            reviewStatus: 'Unreviewed'
          });
          saveDB(db);
        }

        showToast('Laporan harian berhasil dikirim dan dicatat ke sistem!', 'success');
        this.reset();
        document.getElementById('reportDate').valueAsDate = new Date();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        console.error('Submit error:', err);
        showToast('Gagal mengirim laporan. Periksa koneksi Anda.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Kirim Laporan Harian';
      }
    });
  </script>
</body>
</html>
