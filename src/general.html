<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Umum &amp; Incidents — Sistem Pelaporan Digital</title>
  <?!= include('style'); ?>
</head>
<body>

  <header class="<?= userRole ? 'header-internal' : '' ?>">
    <div class="nav-container">
      <? const logoPage = userRole ? 'admin' : 'index'; ?>
      <a href="<?= webAppUrl ? webAppUrl + '?page=' + logoPage : '#' ?>" data-page="<?= logoPage ?>" onclick="navigateToPage(this.getAttribute('data-page'), this); return false;" class="logo">
        <span class="logo-badge <?= userRole ? 'logo-badge-internal' : '' ?>"><?= userRole ? 'INTERNAL CONSOLE' : 'AGRI-DIGITAL' ?></span>
        <span><?= userRole ? 'Portal Operasional' : 'Portal Pelaporan' ?></span>
      </a>
      <? if (userRole) { ?>
        <div id="userIdentityStrip"></div>
      <? } ?>
      <nav>
        <a href="<?= webAppUrl ? webAppUrl + '?page=index' : '#' ?>" onclick="navigateToPage('index', this); return false;" class="nav-link <?= currentPage === 'index' ? 'active' : '' ?>">Daily Form</a>
        <a href="<?= webAppUrl ? webAppUrl + '?page=general' : '#' ?>" onclick="navigateToPage('general', this); return false;" class="nav-link <?= currentPage === 'general' ? 'active' : '' ?>">General Form</a>
        <? if (userRole) { ?>
        <span style="opacity: 0.35; margin: 0 0.35rem; color: var(--color-gray-400);">|</span>
        <? if (userRole === 'admin' || userRole === 'both') { ?>
        <a href="<?= webAppUrl ? webAppUrl + '?page=admin' : '#' ?>" onclick="navigateToPage('admin', this); return false;" id="navLinkAdmin" class="nav-link <?= currentPage === 'admin' ? 'active' : '' ?>">Admin Queue</a>
        <? } ?>
        <? if (userRole === 'manager' || userRole === 'both') { ?>
        <a href="<?= webAppUrl ? webAppUrl + '?page=dashboard' : '#' ?>" onclick="navigateToPage('dashboard', this); return false;" id="navLinkDashboard" class="nav-link <?= currentPage === 'dashboard' ? 'active' : '' ?>">Manager Dashboard</a>
        <? } ?>
        <? } ?>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h1 class="card-title">Laporan Umum &amp; Catatan Lapangan</h1>
      <p class="card-subtitle">Gunakan formulir ini untuk melaporkan kejadian umum, insiden keselamatan, atau catatan khusus.</p>

      <form id="generalForm">
        <div class="form-group">
          <label for="empId">Kode Karyawan / Employee ID <span class="required">*</span></label>
          <input type="text" id="empId" placeholder="EMP-101" required>
        </div>

        <div class="form-group">
          <label for="site">Lokasi / Site <span class="required">*</span></label>
          <select id="site" required>
            <option value="">-- Pilih Lokasi Kerja --</option>
            <option value="Site A — Kebun &amp; Lahan Pertanian">Site A — Kebun &amp; Lahan Pertanian</option>
            <option value="Site B — Peternakan &amp; Kandang">Site B — Peternakan &amp; Kandang</option>
            <option value="Site C — Pabrik Pengolahan &amp; Pakan">Site C — Pabrik Pengolahan &amp; Pakan</option>
            <option value="Site D — Logistik &amp; Gudang">Site D — Logistik &amp; Gudang</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reportDate">Tanggal Laporan <span class="required">*</span></label>
          <input type="date" id="reportDate" required>
        </div>

        <div class="form-group">
          <label for="details">Rincian Laporan / Kronologi <span class="required">*</span></label>
          <div class="help-text">Jelaskan aktivitas, kendala, atau kronologi kejadian secara detail.</div>
          <textarea id="details" rows="5" placeholder="Contoh: Terjadi kebocoran pipa air utama di sektor 3..." required></textarea>
        </div>

        <div class="form-group">
          <label class="checkbox-card">
            <input type="checkbox" id="isSensitive">
            <div>
              <strong>Informasi Sensitif? / Sensitive Information</strong>
              <div class="help-text">Jika dicentang, laporan ini akan diisolasi khusus ke tab Sensitive_Restricted.</div>
            </div>
          </label>
        </div>

        <button type="submit" class="btn btn-primary">Kirim Laporan Umum</button>
      </form>
    </div>
  </div>

  <?!= include('app'); ?>
  <script>
    document.getElementById('reportDate').valueAsDate = new Date();

    document.getElementById('generalForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = this.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Mengirim...';

      const empId = document.getElementById('empId').value;
      const site = document.getElementById('site').value;
      const date = document.getElementById('reportDate').value;
      const details = document.getElementById('details').value;
      const isSensitive = document.getElementById('isSensitive').checked;

      const payload = { empId, site, date, details, isSensitive };

      try {
        if (isLiveServer()) {
          await runServer('submitGeneralReport', payload);
        } else {
          const flag = evaluateFlags(details);
          const db = getDB();
          db.generalReports.unshift({
            id: 'REC-' + Date.now(),
            timestamp: formatDateNow(),
            empId: empId,
            site: site,
            date: date,
            details: details,
            isSensitive: isSensitive,
            severity: flag.severity,
            rank: flag.rank,
            category: flag.category,
            reviewStatus: isSensitive ? 'Unreviewed (Sensitive)' : 'Unreviewed'
          });
          saveDB(db);
        }

        showToast('Laporan umum berhasil dikirim ke sistem!', 'success');
        this.reset();
        document.getElementById('reportDate').valueAsDate = new Date();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        console.error('Submit error:', err);
        showToast('Gagal mengirim laporan. Periksa koneksi Anda.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Kirim Laporan Umum';
      }
    });
  </script>
</body>
</html>
