<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem Lapor MPL | Kamera Lapangan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b131f; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .cam-card { width: 100%; max-width: 520px; background: #14231D; border-radius: 16px; padding: 1.5rem 1.25rem 1.25rem; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); border: 1px solid #1e3a2b; }
    .brand-bar { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 0.65rem; }
    .brand-mark { width: 24px; height: 24px; color: #4ade80; }
    .brand-text { font-size: 0.95rem; font-weight: 700; color: #f8fafc; letter-spacing: -0.01em; }
    .brand-focus { color: #4ade80; font-weight: 800; }
    .title { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #94a3b8; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .video-wrapper { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; aspect-ratio: 4/3; }
    video { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .btn-snap { margin-top: 1.25rem; width: 100%; padding: 0.9rem; border-radius: 10px; border: none; background: #0F6B3A; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 0.2s; box-shadow: 0 4px 12px rgba(15, 107, 58, 0.4); }
    .btn-snap:hover { background: #0B542D; transform: translateY(-1px); }
    .btn-snap:active { transform: translateY(0); }
    .btn-fallback { margin-top: 1rem; width: 100%; padding: 0.85rem; border-radius: 10px; border: 1px solid #10b981; background: #0F6B3A; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn-fallback:hover { background: #0B542D; }
    .status-msg { margin-top: 0.85rem; font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="cam-card">
    <div class="brand-bar">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
        <path d="M 9 37 L 9 14.5 C 9 12.8 10.8 11.8 12.2 12.8 L 24 21.5 L 35.8 12.8 C 37.2 11.8 39 12.8 39 14.5 L 39 37" stroke="currentColor" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 16 30 L 24 36 L 32 30" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
        <circle cx="24" cy="10.5" r="3.5" fill="#C9922E" />
      </svg>
      <span class="brand-text">Sistem Lapor <span class="brand-focus">MPL</span></span>
    </div>

    <div class="title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <span>Kamera Lapangan</span>
    </div>

    <div class="video-wrapper" id="videoContainer">
      <video id="video" autoplay playsinline muted></video>
    </div>
    <canvas id="canvas" style="display: none;"></canvas>
    <input type="file" id="cameraNativeInp" accept="image/*" capture="environment" style="display: none;" onchange="handleNativeCameraSnap(this)">

    <button id="btnSnap" class="btn-snap" onclick="takeSnapshot()" style="display: none;">
      Ambil Snapshot &amp; Gunakan Foto
    </button>
    <button type="button" id="btnNativeCamFallback" class="btn-fallback" style="display: none;" onclick="document.getElementById('cameraNativeInp').click()">
      📷 Ambil / Pilih Foto Dokumentasi
    </button>
    <div class="status-msg" id="statusMsg">Memeriksa kesiapan kamera perangkat...</div>
  </div>

  <script>
    let activeStream = null;

    function getQueryParam(key) {
      try {
        const params = new URLSearchParams(window.location.search);
        return params.get(key);
      } catch(e) {
        return null;
      }
    }

    function isRestrictedIframe() {
      try {
        // 1. Explicit Permissions Policy check
        if (typeof document !== 'undefined' && document.permissionsPolicy && typeof document.permissionsPolicy.allowsFeature === 'function') {
          if (!document.permissionsPolicy.allowsFeature('camera')) return true;
        }
        // 2. Feature Policy check (legacy browsers)
        if (typeof document !== 'undefined' && document.featurePolicy && typeof document.featurePolicy.allowsFeature === 'function') {
          if (!document.featurePolicy.allowsFeature('camera')) return true;
        }
        // 3. Domain check for Google Apps Script HTML Service
        const host = (window.location && window.location.hostname) ? window.location.hostname.toLowerCase() : '';
        if (host.includes('googleusercontent.com') || host.includes('script.google.com')) {
          return true;
        }
        // 4. Any nested iframe context
        if (window.self !== window.top) {
          return true;
        }
      } catch (e) {
        return true;
      }
      return false;
    }

    async function initCamera() {
      const statusEl = document.getElementById('statusMsg');
      const fallbackBtn = document.getElementById('btnNativeCamFallback');
      const snapBtn = document.getElementById('btnSnap');
      const videoBox = document.getElementById('videoContainer');

      if (isRestrictedIframe() || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        // Sandboxed iframe without camera Permissions Policy -> Direct native/file fallback
        if (videoBox) videoBox.style.display = 'none';
        if (snapBtn) snapBtn.style.display = 'none';
        if (fallbackBtn) fallbackBtn.style.display = 'inline-flex';
        statusEl.innerHTML = 'Klik tombol di atas untuk mengambil foto dengan kamera perangkat atau memilih berkas dokumentasi.';
        return;
      }

      try {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        
        const videoEl = document.getElementById('video');
        videoEl.srcObject = activeStream;
        if (snapBtn) snapBtn.style.display = 'flex';
        if (fallbackBtn) fallbackBtn.style.display = 'none';
        statusEl.innerHTML = '✅ Kamera aktif. Arahkan ke objek lalu klik <strong>Ambil Snapshot</strong>.';
      } catch (err) {
        console.warn('WebRTC init notice:', err);
        if (videoBox) videoBox.style.display = 'none';
        if (snapBtn) snapBtn.style.display = 'none';
        if (fallbackBtn) fallbackBtn.style.display = 'inline-flex';
        statusEl.innerHTML = 'Klik tombol di atas untuk mengambil foto langsung via kamera perangkat.';
      }
    }

    function sendCapturedPhoto(base64Data) {
      const slotVal = getQueryParam('slot');
      const slotIndex = (slotVal !== null && slotVal !== undefined) ? parseInt(slotVal, 10) : 0;
      const payload = { type: 'CAMERA_CAPTURED', base64: base64Data, slotIndex: slotIndex };

      let sent = false;
      if (window.opener && !window.opener.closed) {
        try { window.opener.postMessage(payload, '*'); sent = true; } catch(e){}
      }
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage(payload, '*'); sent = true; } catch(e){}
      }
      if (window.top && window.top !== window) {
        try { window.top.postMessage(payload, '*'); sent = true; } catch(e){}
      }

      const statusEl = document.getElementById('statusMsg');
      if (statusEl) {
        statusEl.innerHTML = '<span style="color:#4ade80; font-weight:700;">✅ Foto berhasil diproses! Menutup jendela...</span>';
      }

      if (activeStream) {
        try { activeStream.getTracks().forEach(track => track.stop()); } catch(e){}
      }

      setTimeout(function() {
        try { window.close(); } catch(e){}
      }, 400);
    }

    function takeSnapshot() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      if (!video || !canvas || !video.videoWidth) {
        alert('Kamera belum siap atau tidak aktif.');
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const base64Data = canvas.toDataURL('image/jpeg', 0.85);
      sendCapturedPhoto(base64Data);
    }

    function handleNativeCameraSnap(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
          sendCapturedPhoto(e.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    window.onload = initCamera;
  </script>
</body>
</html>
